<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파이존 주식회사</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 히어로 섹션 */
        .hero-section {
            position: relative;
            height: 450px;
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('images/background.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        /* 서비스 섹션 및 아이콘 크기 조절 */
        .services-section { padding: 80px 40px; max-width: 1200px; margin: 0 auto; text-align: center; }
        .services-grid { display: flex; justify-content: center; gap: 40px; margin-top: 50px; }
        
        .service-card { flex: 1; padding: 20px; transition: 0.3s; }
        
        /* 아이콘 크기 확대 */
        .service-icon {
            width: 120px; /* 기존 80px에서 120px로 확대 */
            height: 120px;
            object-fit: contain;
            margin-bottom: 25px;
        }

        /* 푸터 스타일 복구 및 정렬 */
        footer {
            background: #333;
            color: #ccc;
            padding: 40px 0;
            margin-top: 60px;
        }
        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between; /* 왼쪽 회사명, 오른쪽 정보 배치 */
            align-items: flex-start;
            padding: 0 40px;
        }
        .footer-left h3 { color: #fff; margin-bottom: 10px; font-size: 1.1rem; }
        .footer-left p { font-size: 0.85rem; line-height: 1.6; }
        .footer-right { text-align: right; }
        .footer-right p { font-size: 0.85rem; margin-bottom: 5px; }
        .privacy-link { color: #fff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <section class="hero-section">
        <h1>세상을 연결하는 혁신, 파이존 주식회사</h1>
        <p>최적의 IT 솔루션을 제공합니다.</p>
    </section>

    <section class="services-section">
        <h2>Our Services</h2>
        <div class="services-grid">
            <div class="service-card">
                <img src="images/icon_app.png" alt="앱 개발" class="service-icon">
                <h3>앱 개발</h3>
                <p>iOS와 Android 플랫폼을 아우르는 고품질 앱 제작</p>
            </div>
            <div class="service-card">
                <img src="images/icon_web.png" alt="웹 구축" class="service-icon">
                <h3>웹 구축</h3>
                <p>모든 기기에 최적화된 반응형 웹사이트 구축</p>
            </div>
            <div class="service-card">
                <img src="images/icon_con.png" alt="컨설팅" class="service-icon">
                <h3>컨설팅</h3>
                <p>전문적인 IT 아키텍처 및 비즈니스 전략 제공</p>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-container">
            <div class="footer-left">
                <h3>파이존 주식회사</h3>
                <p>대표이사: [성함] | 사업자등록번호: [번호]</p>
                <p>주소: [상세 주소]</p>
            </div>
            <div class="footer-right">
                <p>© 2026 Pizon Inc.</p>
                <a href="privacy.html" class="privacy-link">개인정보처리방침</a>
            </div>
        </div>
    </footer>
</body>
</html>
