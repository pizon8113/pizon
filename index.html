<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파이존 주식회사</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 헤더 복구: 상단 고정 및 레이아웃 */
        header {
            width: 100%;
            background: #fff;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between; /* 왼쪽 로고, 오른쪽 메뉴 배치 */
            align-items: center;
            padding: 20px 40px;
        }
        .logo { font-weight: bold; font-size: 1.5rem; color: #007bff; text-decoration: none; }
        .nav-menu { display: flex; gap: 30px; list-style: none; margin: 0; padding: 0; }
        .nav-menu a { text-decoration: none; color: #333; font-weight: 500; }
        .nav-menu a:hover { color: #007bff; }

        /* 히어로 섹션 및 헤드카피 크기 확대 */
        .hero-section {
            position: relative;
            height: 550px; /* 높이 약간 확대 */
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('images/background.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        .hero-section h1 { 
            font-size: 3.5rem; /* 기존보다 훨씬 크게 확대 */
            margin-bottom: 20px; 
            font-weight: 800;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.6); 
        }
        .hero-section p { font-size: 1.4rem; opacity: 0.9; }

                /* 서비스 아이콘 이미지 크기 30% 확대 */
        .service-icon img {
            width: 90px !important; /* 기존보다 약 30% 확대 (원하는 크기로 조정 가능) */
            height: auto;
            margin-bottom: 25px; /* 이미지와 아래 글자 사이의 여백 확보 */
            transition: transform 0.3s ease; /* 마우스를 올렸을 때 효과 추가 */
        }

        /* 아이콘에 마우스를 올렸을 때 살짝 커지는 효과 (시각적 재미 추가) */
        .service-item:hover .service-icon img {
            transform: scale(1.1);
        }

        /* 아이콘을 감싸는 전체 항목의 너비와 여백 조정 */
        .service-item {
            text-align: center;
            width: 250px; /* 전체적인 너비를 넓혀 아이콘과 글자의 균형을 맞춤 */
            margin: 0 15px;
        }
        
        /* 푸터 복구 */
        footer { background: #333; color: #ccc; padding: 40px 0; margin-top: 60px; }
        .footer-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; padding: 0 40px; }
        .footer-left h3 { color: #fff; margin-bottom: 10px; }
        .footer-right { text-align: right; }
        .privacy-link { color: #fff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <header>
    <div class="nav-container" style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px;">
        <a href="index.html" class="logo-link" style="display: flex; align-items: center; text-decoration: none;">
            <img src="images/logo.png" alt="파이존 로고" style="height: 50px; width: auto;"> <span style="font-weight: bold; font-size: 1.5rem; color: #007bff; margin-left: 10px;">PIZON</span>
        </a>
        
        <ul class="nav-menu" style="display: flex; gap: 30px; list-style: none; margin: 0; padding: 0;">
            <li><a href="index.html" style="text-decoration: none; color: #007bff; font-weight: bold;">서비스</a></li>
            <li><a href="portfolio.html" style="text-decoration: none; color: #333;">포트폴리오</a></li>
            <li><a href="notice.html" style="text-decoration: none; color: #333;">공지사항</a></li>
            <li><a href="contact.html" style="text-decoration: none; color: #333;">문의하기</a></li>
        </ul>
    </div>
</header>


    <section class="hero-section">
        <h1>세상을 연결하는 혁신, 파이존 주식회사</h1>
        <p>최적의 IT 솔루션을 제공하여 비즈니스의 가치를 높입니다.</p>
    </section>

    <section class="services-section">
        <h2>Our Services</h2>
        <div class="services-grid">
            <div class="service-card">
                <img src="images/icon_app.png" alt="앱 개발" class="service-icon">
                <h3>앱 개발</h3>
                <p>고퀄리티 모바일 앱 제작</p>
            </div>
            <div class="service-card">
                <img src="images/icon_web.png" alt="웹 구축" class="service-icon">
                <h3>웹 구축</h3>
                <p>최적화된 반응형 웹사이트</p>
            </div>
            <div class="service-card">
                <img src="images/icon_con.png" alt="컨설팅" class="service-icon">
                <h3>컨설팅</h3>
                <p>IT 아키텍처 및 전략 수립</p>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-container">
            <div class="footer-left">
                <h3>파이존 주식회사</h3>
                <p>대표이사: [성함] | 사업자등록번호: [번호]</p>
                <p>주소: [상세 주소]</p>
            </div>
            <div class="footer-right">
                <p>© 2026 Pizon Co., Ltd.</p>
                <a href="privacy.html" class="privacy-link">개인정보처리방침</a>
            </div>
        </div>
    </footer>
</body>
</html>
