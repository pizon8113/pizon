<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오 - 파이존 주식회사</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 기본 스타일 유지 */
        header { border-bottom: 1px solid #eee; padding: 20px 0; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        nav ul { display: flex; list-style: none; gap: 30px; margin: 0; padding: 0; }
        nav ul li a { text-decoration: none; color: #333; font-weight: 500; }
        nav ul li a.active { color: #007bff; font-weight: bold; }

        .portfolio-section { max-width: 1100px; margin: 60px auto; padding: 0 20px; }
        .portfolio-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 30px; 
            margin-top: 40px;
        }

        .portfolio-item { 
            background: #fff; 
            border: 1px solid #eee; 
            border-radius: 12px; 
            overflow: hidden; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .portfolio-item:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 12px 24px rgba(0,0,0,0.1); 
        }
        
        .pf-img { width: 100%; height: 220px; object-fit: cover; background: #f8f9fa; }
        .pf-info { padding: 20px; }
        .pf-info h3 { margin: 0 0 10px 0; font-size: 1.25rem; color: #222; }
        .pf-info p { margin: 0; color: #666; font-size: 0.95rem; line-height: 1.6; }
        .pf-category { 
            display: inline-block; 
            padding: 4px 10px; 
            background: #e7f3ff; 
            color: #007bff; 
            border-radius: 4px; 
            font-size: 0.75rem; 
            font-weight: bold; 
            margin-bottom: 10px; 
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo" style="font-weight: bold; font-size: 1.5rem; color: #007bff;">PIZON</div>
            <ul>
                <li><a href="index.html">서비스</a></li>
                <li><a href="portfolio.html" class="active">포트폴리오</a></li>
                <li><a href="notice.html">공지사항</a></li>
                <li><a href="contact.html">문의하기</a></li>
            </ul>
        </nav>
    </header>

    <section class="portfolio-section">
        <h1 style="letter-spacing: -1px;">Our Portfolio</h1>
        <p style="color:#888;">파이존이 만들어온 성공의 기록들입니다.</p>
        
        <div class="portfolio-grid">
            <div class="portfolio-item">
                <img src="images/port01.png" class="pf-img" alt="인스타그램 광고 대행" onerror="this.src='https://via.placeholder.com/400x300?text=PIZON'">
                <div class="pf-info">
                    <span class="pf-category">SNS 마케팅</span>
                    <h3>인스타그램 광고 대행</h3>
                    <p>타겟 최적화와 정밀한 분석을 통해 브랜드 인지도를 높이고 매출 성장을 이끌어냅니다.</p>
                </div>
            </div>

            <div class="portfolio-item">
                <img src="https://via.placeholder.com/400x300?text=Project+02" class="pf-img" alt="프로젝트 제목">
                <div class="pf-info">
                    <span class="pf-category">웹 디자인</span>
                    <h3>새로운 프로젝트 제목</h3>
                    <p>이곳에 프로젝트에 대한 상세 설명을 입력하세요.</p>
                </div>
            </div>

        </div>
    </section>
</body>
</html>
