<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오 - 파이존 주식회사</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 헤더 및 메뉴 스타일 */
        header { border-bottom: 1px solid #eee; padding: 20px 0; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        nav ul { display: flex; list-style: none; gap: 30px; margin: 0; padding: 0; }
        nav ul li a { text-decoration: none; color: #333; font-weight: 500; }
        nav ul li a.active { color: #007bff; font-weight: bold; }

        /* 포트폴리오 섹션 스타일 */
        .portfolio-section { max-width: 1100px; margin: 60px auto; padding: 0 20px; }
        .portfolio-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 30px; 
            margin-top: 40px;
        }

        /* 카드 스타일 */
        .portfolio-item { 
            background: #fff; 
            border: 1px solid #eee; 
            border-radius: 12px; 
            overflow: hidden; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .portfolio-item:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 12px 24px rgba(0,0,0,0.1); 
        }
        
        .pf-img { width: 100%; height: 220px; object-fit: cover; background: #f8f9fa; }
        .pf-info { padding: 20px; }
        .pf-info h3 { margin: 0 0 10px 0; font-size: 1.25rem; color: #222; }
        .pf-info p { margin: 0; color: #666; font-size: 0.95rem; line-height: 1.6; }
        .pf-category { 
            display: inline-block; 
            padding: 4px 10px; 
            background: #e7f3ff; 
            color: #007bff; 
            border-radius: 4px; 
            font-size: 0.75rem; 
            font-weight: bold; 
            margin-bottom: 10px; 
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo" style="font-weight: bold; font-size: 1.5rem; color: #007bff;">PIZON</div>
            <ul>
                <li><a href="index.html">서비스</a></li>
                <li><a href="portfolio.html" class="active">포트폴리오</a></li>
                <li><a href="notice.html">공지사항</a></li>
                <li><a href="contact.html">문의하기</a></li>
            </ul>
        </nav>
    </header>

    <section class="portfolio-section">
        <h1 style="letter-spacing: -1px;">Our Portfolio</h1>
        <p style="color:#888;">파이존이 만들어온 성공의 기록들입니다.</p>
        
        <div class="portfolio-grid" id="portfolio-list">
            </div>
    </section>

    <script>
        // 대표님이 주신 포트폴리오 시트 CSV 주소
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSpk-EmQqeMguX_yaOkABtQuZzxB-j9V4If0OnUUCWxixonAz_dWBsIcRcejNpp7al2q4vhApOfz96c/pub?gid=1261439472&single=true&output=csv";

        async function loadPortfolio() {
            const list = document.getElementById('portfolio-list');
            try {
                const res = await fetch(sheetUrl);
                const csvData = await res.text();
                
                // CSV 파싱 로직 (줄바꿈 및 따옴표 처리 적용)
                const pattern = /([^\r\n",]+|"(?:[^"]|"")*")?(?:,|\r?\n|$)/g;
                let rowData = [];
                let currentLine = [];
                let match;
                
                while ((match = pattern.exec(csvData)) !== null) {
                    let val = match[1] ? match[1] : "";
                    if (val.startsWith('"') && val.endsWith('"')) {
                        val = val.slice(1, -1).replace(/""/g, '"');
                    }
                    currentLine.push(val);
                    if (match[0].endsWith('\n') || match[0] === "") {
                        if (currentLine.some(cell => cell.trim() !== "")) {
                            rowData.push(currentLine);
                        }
                        currentLine = [];
                        if (match[0] === "") break;
                    }
                }

                list.innerHTML = "";
                // 첫 번째 줄(헤더)을 제외하고 반복문 실행
                rowData.slice(1).forEach(columns => {
                    if (columns.length < 2) return;

                    const title = columns[0].trim();
                    const desc = columns[1].trim();
                    const imgUrl = columns[2] ? columns[2].trim() : "https://via.placeholder.com/400x300?text=PIZON";
                    const category = columns[3] ? columns[3].trim() : "Marketing";

                    const item = document.createElement('div');
                    item.className = 'portfolio-item';
                    item.innerHTML = `
                        <img src="${imgUrl}" class="pf-img" alt="${title}" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Error'">
                        <div class="pf-info">
                            <span class="pf-category">${category}</span>
                            <h3>${title}</h3>
                            <p>${desc}</p>
                        </div>
                    `;
                    list.appendChild(item);
                });
            } catch (e) {
                console.error(e);
                list.innerHTML = "<p style='grid-column: 1/-1; text-align:center; padding:50px;'>데이터를 불러오는 중 오류가 발생했습니다.</p>";
            }
        }
        loadPortfolio();
    </script>
</body>
</html>
