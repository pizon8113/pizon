<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - 파이존 주식회사</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 메뉴 우측 정렬 */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        nav ul { display: flex; gap: 30px; margin-left: auto; } /* 메뉴를 오른쪽으로 */

        .notice-section { max-width: 1000px; margin: 60px auto; padding: 0 20px; }
        .notice-table { width: 100%; border-collapse: collapse; margin-top: 30px; table-layout: fixed; }
        .notice-table th, .notice-table td { padding: 15px; border-bottom: 1px solid #eee; text-align: center; }
        
        /* 칸 너비 조정: 제목이 너무 넓지 않게 */
        .col-no { width: 10%; }
        .col-title { width: 65%; text-align: left !important; }
        .col-date { width: 25%; }

        .notice-table td.title { cursor: pointer; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .notice-table td.title:hover { color: #007bff; text-decoration: underline; }

        /* 팝업(모달) 스타일 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: #fff; margin: 15% auto; padding: 30px; width: 50%; border-radius: 10px; position: relative; line-height: 1.6; }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 25px; cursor: pointer; }
        #modal-date { color: #888; font-size: 0.9rem; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo" style="font-weight: bold; font-size: 1.5rem; color: #007bff;">PIZON</div>
            <ul>
                <li><a href="index.html">서비스</a></li>
                <li><a href="portfolio.html">포트폴리오</a></li>
                <li><a href="notice.html" class="active" style="color:#007bff; font-weight:bold;">공지사항</a></li>
                <li><a href="contact.html">문의하기</a></li>
            </ul>
        </nav>
    </header>

    <section class="notice-section">
        <h1 style="border-left: 5px solid #007bff; padding-left: 15px;">Notice</h1>
        <table class="notice-table">
            <thead>
                <tr>
                    <th class="col-no">No.</th>
                    <th class="col-title">제목</th>
                    <th class="col-date">날짜</th>
                </tr>
            </thead>
            <tbody id="notice-list"></tbody>
        </table>
        <div id="pagination" class="pagination" style="display:flex; justify-content:center; gap:10px; margin-top:30px;"></div>
    </section>

    <div id="noticeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-date"></div>
            <h2 id="modal-title" style="margin-bottom:20px;"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSpk-EmQqeMguX_yaOkABtQuZzxB-j9V4If0OnUUCWxixonAz_dWBsIcRcejNpp7al2q4vhApOfz96c/pub?gid=0&single=true&output=csv";
        let allNotices = [];
        const itemsPerPage = 10;
        let currentPage = 1;

        async function loadNotice() {
            try {
                const res = await fetch(sheetUrl);
                const csvData = await res.text();
                const rows = csvData.split(/\r?\n/).slice(1); 
                allNotices = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return { 
                        no: cols[0]?.replace(/"/g, "") || "", 
                        title: cols[1]?.replace(/"/g, "") || "", 
                        date: cols[2]?.replace(/"/g, "") || "",
                        content: cols[3]?.replace(/"/g, "") || "내용이 없습니다." // 시트의 D열(내용) 가져오기
                    };
                }).filter(item => item.title.trim() !== "").reverse(); 
                displayNotices(1);
            } catch (e) { console.error(e); }
        }

        function displayNotices(page) {
            currentPage = page;
            const start = (page - 1) * itemsPerPage;
            const pagedNotices = allNotices.slice(start, start + itemsPerPage);
            const listEl = document.getElementById('notice-list');
            listEl.innerHTML = pagedNotices.map(item => `
                <tr>
                    <td>${item.no}</td>
                    <td class="title" onclick="openModal('${item.title}', '${item.content}', '${item.date}')">${item.title}</td>
                    <td>${item.date}</td>
                </tr>
            `).join('');
            displayPagination();
        }

        function displayPagination() {
            const totalPages = Math.ceil(allNotices.length / itemsPerPage);
            const paginationEl = document.getElementById('pagination');
            if(totalPages <= 1) { paginationEl.innerHTML = ""; return; }
            let html = "";
            for (let i = 1; i <= totalPages; i++) {
                html += `<button onclick="displayNotices(${i})" style="padding:5px 10px; cursor:pointer; background:${i===currentPage?'#007bff':'#fff'}; color:${i===currentPage?'#fff':'#333'}; border:1px solid #ddd;">${i}</button>`;
            }
            paginationEl.innerHTML = html;
        }

        function openModal(title, content, date) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = content;
            document.getElementById('modal-date').innerText = "작성일: " + date;
            document.getElementById('noticeModal').style.display = "block";
        }

        function closeModal() { document.getElementById('noticeModal').style.display = "none"; }
        window.onclick = function(event) { if (event.target == document.getElementById('noticeModal')) closeModal(); }

        loadNotice();
    </script>
</body>
</html>
