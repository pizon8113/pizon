<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - 파이존 주식회사</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 메뉴를 다른 페이지와 동일한 위치로 고정 */
        nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; }
        nav ul { display: flex; gap: 30px; list-style: none; }

        .notice-section { max-width: 1000px; margin: 60px auto; padding: 0 20px; min-height: 500px; }
        .notice-table { width: 100%; border-collapse: collapse; margin-top: 30px; border-top: 2px solid #333; }
        .notice-table th, .notice-table td { padding: 18px 15px; border-bottom: 1px solid #eee; text-align: center; }
        
        /* 제목 칸 가운데 정렬 및 강조 */
        .col-title { cursor: pointer; transition: 0.2s; font-weight: 500; }
        .col-title:hover { color: #007bff; text-decoration: underline; }
        .col-date { color: #888; width: 150px; }
        .col-no { width: 70px; }

        /* 페이지네이션 버튼 */
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 40px; }
        .pagination button { padding: 8px 15px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 4px; }
        .pagination button.active { background: #007bff; color: #fff; border-color: #007bff; font-weight: bold; }

        /* 팝업(모달) 스타일 - 깔끔한 디자인 */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: #fff; margin: 12% auto; padding: 35px; width: 90%; max-width: 550px; border-radius: 15px; position: relative; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #aaa; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo" style="font-weight: bold; font-size: 1.5rem; color: #007bff;">PIZON</div>
            <ul>
                <li><a href="index.html">서비스</a></li>
                <li><a href="portfolio.html">포트폴리오</a></li>
                <li><a href="notice.html" class="active">공지사항</a></li>
                <li><a href="contact.html">문의하기</a></li>
            </ul>
        </nav>
    </header>

    <section class="notice-section">
        <h1 style="border-left: 5px solid #007bff; padding-left: 15px; margin-bottom: 10px;">Notice</h1>
        <table class="notice-table">
            <thead>
                <tr>
                    <th class="col-no">No.</th>
                    <th>제목</th>
                    <th class="col-date">날짜</th>
                </tr>
            </thead>
            <tbody id="notice-list">
                <tr><td colspan="3">데이터를 불러오고 있습니다...</td></tr>
            </tbody>
        </table>
        <div id="pagination" class="pagination"></div>
    </section>

    <div id="noticeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-date" style="color:#999; font-size:0.85rem; margin-bottom:8px;"></div>
            <h2 id="modal-title" style="margin-bottom:20px; font-size:1.4rem; color:#222; border-bottom:1px solid #f0f0f0; padding-bottom:15px;"></h2>
            <div id="modal-body" style="line-height:1.7; color:#444; white-space:pre-wrap; font-size:1rem;"></div>
        </div>
    </div>

    <script>
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSpk-EmQqeMguX_yaOkABtQuZzxB-j9V4If0OnUUCWxixonAz_dWBsIcRcejNpp7al2q4vhApOfz96c/pub?gid=0&single=true&output=csv";
        let allNotices = [];
        const itemsPerPage = 10;

        async function loadNotice() {
            try {
                const res = await fetch(sheetUrl);
                const csvData = await res.text();
                // 정규식을 이용해 콤마가 포함된 텍스트도 정확히 분리
                const rows = csvData.split(/\r?\n/).filter(row => row.trim() !== "").slice(1);
                
                allNotices = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return { 
                        no: cols[0]?.replace(/"/g, "").trim() || "", 
                        title: cols[1]?.replace(/"/g, "").trim() || "", 
                        date: cols[2]?.replace(/"/g, "").trim() || "",
                        content: cols[3]?.replace(/"/g, "").trim() || "상세 내용이 없습니다."
                    };
                }).filter(item => item.title); // 제목이 있는 것만 표시

                // 번호순(내림차순) 정렬 보장
                allNotices.sort((a, b) => parseInt(b.no) - parseInt(a.no));

                displayNotices(1);
            } catch (e) {
                document.getElementById('notice-list').innerHTML = "<tr><td colspan='3'>데이터 로드 실패</td></tr>";
            }
        }

        function displayNotices(page) {
            const start = (page - 1) * itemsPerPage;
            const pagedData = allNotices.slice(start, start + itemsPerPage);
            const listEl = document.getElementById('notice-list');
            
            listEl.innerHTML = pagedData.map(item => `
                <tr>
                    <td>${item.no}</td>
                    <td class="col-title" onclick="openModal('${item.title.replace(/'/g, "\\'")}', '${item.content.replace(/'/g, "\\'")}', '${item.date}')">${item.title}</td>
                    <td class="col-date">${item.date}</td>
                </tr>
            `).join('');
            
            updatePagination(page);
        }

        function updatePagination(currentPage) {
            const totalPages = Math.ceil(allNotices.length / itemsPerPage);
            const paginationEl = document.getElementById('pagination');
            let html = "";
            for (let i = 1; i <= totalPages; i++) {
                html += `<button onclick="displayNotices(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            paginationEl.innerHTML = html;
        }

        function openModal(title, content, date) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = content;
            document.getElementById('modal-date').innerText = "작성일: " + date;
            document.getElementById('noticeModal').style.display = "block";
        }

        function closeModal() { document.getElementById('noticeModal').style.display = "none"; }
        window.onclick = function(e) { if (e.target == document.getElementById('noticeModal')) closeModal(); }

        loadNotice();
    </script>
</body>
</html>
