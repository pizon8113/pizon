<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - 파이존 주식회사</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .notice-section { max-width: 1100px; margin: 60px auto; padding: 0 20px; }
        .notice-table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        .notice-table th { border-top: 2px solid #333; border-bottom: 1px solid #eee; padding: 15px; background: #f9f9f9; }
        .notice-table td { border-bottom: 1px solid #eee; padding: 15px; text-align: center; }
        .notice-table td.title { text-align: left; cursor: pointer; }
        
        /* 페이지네이션 스타일 */
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
        .pagination button { 
            padding: 8px 15px; border: 1px solid #ddd; background: #fff; 
            cursor: pointer; border-radius: 4px; transition: 0.3s;
        }
        .pagination button.active { background: #007bff; color: #fff; border-color: #007bff; }
        .pagination button:hover:not(.active) { background: #f0f0f0; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo" style="font-weight: bold; font-size: 1.5rem; color: #007bff;">PIZON</div>
            <ul>
                <li><a href="index.html">서비스</a></li>
                <li><a href="portfolio.html">포트폴리오</a></li>
                <li><a href="notice.html" class="active">공지사항</a></li>
                <li><a href="contact.html">문의하기</a></li>
            </ul>
        </nav>
    </header>

    <section class="notice-section">
        <h1>Notice</h1>
        <table class="notice-table">
            <thead>
                <tr>
                    <th style="width: 80px;">No.</th>
                    <th>제목</th>
                    <th style="width: 150px;">날짜</th>
                </tr>
            </thead>
            <tbody id="notice-list">
                </tbody>
        </table>
        <div id="pagination" class="pagination"></div>
    </section>

    <script>
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSpk-EmQqeMguX_yaOkABtQuZzxB-j9V4If0OnUUCWxixonAz_dWBsIcRcejNpp7al2q4vhApOfz96c/pub?gid=0&single=true&output=csv";
        let allNotices = [];
        const itemsPerPage = 10; // 10개씩 끊기
        let currentPage = 1;

        async function loadNotice() {
            try {
                const res = await fetch(sheetUrl);
                const csvData = await res.text();
                
                // CSV 파싱 (기존 로직 유지)
                const rows = csvData.split('\n').slice(1);
                allNotices = rows.map(row => {
                    const cols = row.split(',');
                    return { no: cols[0], title: cols[1], date: cols[2] };
                }).filter(item => item.title).reverse(); // 최신순 정렬

                displayNotices(currentPage);
            } catch (e) {
                document.getElementById('notice-list').innerHTML = "<tr><td colspan='3'>데이터 로딩 오류</td></tr>";
            }
        }

        function displayNotices(page) {
            currentPage = page;
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pagedNotices = allNotices.slice(start, end);

            const listEl = document.getElementById('notice-list');
            listEl.innerHTML = pagedNotices.map(item => `
                <tr>
                    <td>${item.no}</td>
                    <td class="title">${item.title}</td>
                    <td>${item.date}</td>
                </tr>
            `).join('');

            displayPagination();
        }

        function displayPagination() {
            const totalPages = Math.ceil(allNotices.length / itemsPerPage);
            const paginationEl = document.getElementById('pagination');
            
            let html = "";
            for (let i = 1; i <= totalPages; i++) {
                html += `<button onclick="displayNotices(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            paginationEl.innerHTML = html;
        }

        loadNotice();
    </script>
</body>
</html>
