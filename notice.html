<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - 파이존 주식회사</title>
    <link rel="stylesheet" href="style.css">
    <style>
        header { border-bottom: 1px solid #eee; padding: 20px 0; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        nav ul { display: flex; list-style: none; gap: 30px; margin: 0; padding: 0; }
        nav ul li a { text-decoration: none; color: #333; font-weight: 500; }
        nav ul li a.active { color: #007bff; font-weight: bold; }
        .notice-section { max-width: 900px; margin: 60px auto; padding: 0 20px; }
        .notice-table { width: 100%; border-collapse: collapse; border-top: 2px solid #333; }
        .notice-table th { padding: 15px; background: #fcfcfc; border-bottom: 1px solid #ddd; }
        .notice-row { cursor: pointer; border-bottom: 1px solid #eee; }
        .notice-row:hover { background-color: #f8f9fa; }
        .notice-row td { padding: 15px; text-align: center; color: #555; }
        .title-cell { text-align: left !important; color: #222 !important; font-weight: 500; }
        .detail-content { display: none; background: #fafafa; border-bottom: 1px solid #eee; }
        .detail-box { padding: 25px 40px; line-height: 1.8; color: #666; white-space: pre-wrap; text-align: left; font-size: 0.95rem; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo" style="font-weight: bold; font-size: 1.5rem; color: #007bff;">PIZON</div>
            <ul>
                <li><a href="index.html">서비스</a></li>
                <li><a href="portfolio.html">포트폴리오</a></li>
                <li><a href="notice.html" class="active">공지사항</a></li>
            </ul>
        </nav>
    </header>
    <section class="notice-section">
        <h1 style="margin-bottom: 30px;">Notice</h1>
        <table class="notice-table">
            <thead>
                <tr><th style="width: 60px;">No.</th><th>제목</th><th style="width: 130px;">날짜</th></tr>
            </thead>
            <tbody id="notice-list"></tbody>
        </table>
    </section>
    <script>
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSpk-EmQqeMguX_yaOkABtQuZzxB-j9V4If0OnUUCWxixonAz_dWBsIcRcejNpp7al2q4vhApOfz96c/pub?output=csv";
        async function loadNotice() {
            const list = document.getElementById('notice-list');
            try {
                const res = await fetch(sheetUrl);
                const csvData = await res.text();
                // 1. 데이터의 모든 줄을 가져옵니다 (slice 안 함)
                const rows = csvData.trim().split(/\r?\n/); 
                list.innerHTML = ""; 
                rows.forEach((row, index) => {
                    const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (columns.length >= 3) {
                        const num = columns[0].replace(/"/g, "").trim();
                        const title = columns[1].replace(/"/g, "").trim();
                        const date = columns[2].replace(/"/g, "").trim();
                        const content = columns[3] ? columns[3].replace(/"/g, "").trim() : "내용이 없습니다.";
                        // 항목명(No, 제목)이 적힌 줄은 건너뜁니다.
                        if (num === "No" || num === "번호") return;
                        const tr = document.createElement('tr');
                        tr.className = 'notice-row';
                        tr.innerHTML = `<td>${num}</td><td class="title-cell">${title}</td><td>${date}</td>`;
                        const dTr = document.createElement('tr');
                        dTr.className = 'detail-content';
                        dTr.id = `detail-${index}`;
                        dTr.innerHTML = `<td colspan="3"><div class="detail-box">${content}</div></td>`;
                        tr.onclick = () => {
                            const isV = dTr.style.display === 'table-row';
                            document.querySelectorAll('.detail-content').forEach(el => el.style.display = 'none');
                            if (!isV) dTr.style.display = 'table-row';
                        };
                        list.appendChild(tr);
                        list.appendChild(dTr);
                    }
                });
            } catch (e) { list.innerHTML = "<tr><td colspan='3' style='text-align:center;'>로딩 실패</td></tr>"; }
        }
        loadNotice();
    </script>
</body>
</html>
