<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - 파이존 주식회사</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 메뉴 위치 및 디자인 고정 */
        nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; }
        nav ul { display: flex; gap: 30px; list-style: none; }

        .notice-section { max-width: 1000px; margin: 60px auto; padding: 0 20px; min-height: 500px; }
        .notice-table { width: 100%; border-collapse: collapse; margin-top: 30px; border-top: 2px solid #333; table-layout: fixed; }
        
        /* 모든 셀 텍스트를 정중앙으로 배치 */
        .notice-table th, .notice-table td { padding: 18px 10px; border-bottom: 1px solid #eee; text-align: center; vertical-align: middle; }
        
        .col-no { width: 60px; }
        .col-date { width: 120px; color: #888; }
        .col-title { cursor: pointer; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .col-title:hover { color: #007bff; text-decoration: underline; }

        /* 페이지네이션 */
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 40px; }
        .pagination button { padding: 8px 15px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 4px; }
        .pagination button.active { background: #007bff; color: #fff; border-color: #007bff; font-weight: bold; }

        /* 팝업 모달 */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: #fff; margin: 12% auto; padding: 35px; width: 90%; max-width: 550px; border-radius: 15px; position: relative; text-align: left; }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #aaa; }
    </style>
</head>
<body>
   <header>
        <header style="width: 100%; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000;">
        <div class="nav-container" style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px;">
            <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
                <img src="images/logo.png" alt="파이존 로고" style="height: 50px; width: auto;"> 
                <span style="font-weight: bold; font-size: 1.5rem; color: #007bff; margin-left: 10px;">PIZON</span>
            </a>
            
            <ul class="nav-menu" style="display: flex; gap: 30px; list-style: none; margin: 0; padding: 0;">
                <li><a href="index.html" style="text-decoration: none; color: #333;">서비스</a></li>
                <li><a href="portfolio.html" style="text-decoration: none; color: #333;">포트폴리오</a></li>
                <li><a href="notice.html" style="text-decoration: none; color: #007bff; font-weight: bold;">공지사항</a></li>
                <li><a href="contact.html" style="text-decoration: none; color: #333;">문의하기</a></li>
            </ul>
        </div>
    </header>



<style>
     /* 49줄 시작: 메뉴 활성화 및 목록 간격 축소 스타일 */
        nav ul li a.active {
            color: #007bff !important;
            font-weight: bold;
        }

        /* 목록 간격을 좁게 조정 (시각적 편의성) */
        .notice-table td {
            padding: 10px 15px !important; /* 위아래 간격을 10px로 축소 */
            font-size: 0.95rem;
        }
    
    /* 기존 스타일 유지 */
    nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; }
    nav ul { display: flex; gap: 30px; list-style: none; }
    nav ul li a { text-decoration: none; color: #333; transition: 0.3s; }
    nav ul li a:hover { color: #007bff; }
</style>


    <section class="notice-section">
        <h1 style="border-left: 5px solid #007bff; padding-left: 15px;">Notice</h1>
        <table class="notice-table">
            <thead>
                <tr>
                    <th class="col-no">No.</th>
                    <th>제목</th>
                    <th class="col-date">날짜</th>
                </tr>
            </thead>
            <tbody id="notice-list"></tbody>
        </table>
        <div id="pagination" class="pagination"></div>
    </section>

    <div id="noticeModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-date" style="color:#999; font-size:0.85rem; margin-bottom:8px;"></div>
            <h2 id="modal-title" style="margin-bottom:20px; font-size:1.4rem; border-bottom:1px solid #f0f0f0; padding-bottom:15px;"></h2>
            <div id="modal-body" style="line-height:1.7; color:#444; white-space:pre-wrap;"></div>
        </div>
    </div>

    <script>
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSpk-EmQqeMguX_yaOkABtQuZzxB-j9V4If0OnUUCWxixonAz_dWBsIcRcejNpp7al2q4vhApOfz96c/pub?gid=0&single=true&output=csv";
        let allNotices = [];

        // 줄바꿈이 포함된 CSV를 완벽하게 분석하는 함수
        function parseCSV(text) {
            const result = [];
            let row = [];
            let col = "";
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let nextChar = text[i+1];

                if (char === '"' && inQuotes && nextChar === '"') { col += '"'; i++; }
                else if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { row.push(col.trim()); col = ""; }
                else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (col || row.length > 0) {
                        row.push(col.trim());
                        result.push(row);
                        col = ""; row = [];
                    }
                    if (char === '\r' && nextChar === '\n') i++;
                } 
                else { col += char; }
            }
            if (col || row.length > 0) { row.push(col.trim()); result.push(row); }
            return result;
        }

        async function loadNotice() {
            try {
                const res = await fetch(sheetUrl);
                const csvData = await res.text();
                const rows = parseCSV(csvData).slice(1); // 헤더 제외
                
                allNotices = rows.map(cols => ({
                    no: cols[0] || "",
                    title: cols[1] || "",
                    date: cols[2] || "",
                    content: cols[3] || "내용이 없습니다."
                })).filter(item => item.no);

                allNotices.sort((a, b) => parseInt(b.no) - parseInt(a.no));
                displayNotices(1);
            } catch (e) { console.error("데이터 로드 오류:", e); }
        }

        function displayNotices(page) {
            const itemsPerPage = 10;
            const start = (page - 1) * itemsPerPage;
            const pagedData = allNotices.slice(start, start + itemsPerPage);
            const listEl = document.getElementById('notice-list');
            
            listEl.innerHTML = pagedData.map(item => `
                <tr>
                    <td>${item.no}</td>
                    <td class="col-title" onclick="openModal('${item.title.replace(/'/g, "\\'")}', '${item.content.replace(/'/g, "\\'").replace(/\n/g, "\\n")}', '${item.date}')">${item.title}</td>
                    <td>${item.date}</td>
                </tr>
            `).join('');
            
            updatePagination(page, itemsPerPage);
        }

        function updatePagination(currentPage, itemsPerPage) {
            const totalPages = Math.ceil(allNotices.length / itemsPerPage);
            const paginationEl = document.getElementById('pagination');
            let html = "";
            for (let i = 1; i <= totalPages; i++) {
                html += `<button onclick="displayNotices(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            paginationEl.innerHTML = html;
        }

        function openModal(title, content, date) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = content;
            document.getElementById('modal-date').innerText = "작성일: " + date;
            document.getElementById('noticeModal').style.display = "block";
        }
        function closeModal() { document.getElementById('noticeModal').style.display = "none"; }
        window.onclick = function(e) { if (e.target == document.getElementById('noticeModal')) closeModal(); }

        loadNotice();
    </script>
</body>
</html>
