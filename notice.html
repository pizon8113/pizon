<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - 파이존 주식회사</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .notice-row { cursor: pointer; transition: background 0.3s; }
        .notice-row:hover { background-color: #f9f9f9; }
        .detail-content { 
            display: none; 
            padding: 20px; 
            background: #fafafa; 
            border-bottom: 1px solid #eee; 
            line-height: 1.6;
            color: #444;
        }
        .notice-table th { border-bottom: 2px solid #333; padding: 12px; }
        .num-col { width: 50px; text-align: center; color: #888; }
        .date-col { width: 120px; text-align: center; color: #888; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">PIZON</div>
            <ul>
                <li><a href="index.html">서비스</a></li>
                <li><a href="portfolio.html">포트폴리오</a></li>
                <li><a href="notice.html" class="active">공지사항</a></li>
            </ul>
        </nav>
    </header>

    <section class="notice-section" style="max-width: 900px; margin: 50px auto; padding: 0 20px;">
        <h1 style="font-size: 2rem; margin-bottom: 30px;">Notice</h1>
        <table class="notice-table" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th class="num-col">No.</th>
                    <th style="text-align: left;">제목</th>
                    <th class="date-col">날짜</th>
                </tr>
            </thead>
            <tbody id="notice-list">
                <tr><td colspan="3" style="text-align:center; padding:50px;">불러오는 중...</td></tr>
            </tbody>
        </table>
    </section>

    <script>
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSpk-EmQqeMguX_yaOkABtQuZzxB-j9V4If0OnUUCWxixonAz_dWBsIcRcejNpp7al2q4vhApOfz96c/pub?output=csv";

        async function loadNotice() {
            const list = document.getElementById('notice-list');
            try {
                const res = await fetch(sheetUrl);
                const data = await res.text();
                const rows = data.split(/\r?\n/).slice(1); 
                list.innerHTML = ""; 

                rows.forEach((row, index) => {
                    const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (columns.length >= 3) {
                        const num = columns[0].replace(/"/g, "").trim();   // A열: 번호
                        const title = columns[1].replace(/"/g, "").trim(); // B열: 제목
                        const date = columns[2].replace(/"/g, "").trim();  // C열: 날짜
                        const content = columns[3] ? columns[3].replace(/"/g, "").trim() : "상세 내용이 없습니다."; // D열: 내용

                        // 리스트 행
                        const tr = document.createElement('tr');
                        tr.className = 'notice-row';
                        tr.onclick = () => toggleContent(index);
                        tr.innerHTML = `
                            <td class="num-col" style="padding:15px; border-bottom:1px solid #eee;">${num}</td>
                            <td style="padding:15px; border-bottom:1px solid #eee; text-align:left;">${title}</td>
                            <td class="date-col" style="padding:15px; border-bottom:1px solid #eee;">${date}</td>
                        `;
                        
                        // 상세 내용 행 (처음엔 숨김)
                        const detailTr = document.createElement('tr');
                        detailTr.id = `detail-${index}`;
                        detailTr.className = 'detail-content';
                        detailTr.innerHTML = `<td colspan="3">${content.replace(/\n/g, '<br>')}</td>`;

                        list.appendChild(tr);
                        list.appendChild(detailTr);
                    }
                });
            } catch (error) {
                list.innerHTML = "<tr><td colspan='3' style='text-align:center;'>오류가 발생했습니다.</td></tr>";
            }
        }

        function toggleContent(index) {
            const detail = document.getElementById(`detail-${index}`);
            const isVisible = detail.style.display === 'table-row';
            
            // 다른 열려있는 내용 다 닫기 (선택 사항)
            document.querySelectorAll('.detail-content').forEach(d => d.style.display = 'none');
            
            // 클릭한 것만 열기
            detail.style.display = isVisible ? 'none' : 'table-row';
        }

        loadNotice();
    </script>
</body>
</html>
